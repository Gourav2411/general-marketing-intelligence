name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
