name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signoff:
    name: signoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a DCO sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by line. Amend it with git commit --amend -s and force-push the PR branch."
              failed=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
